server {
    listen 80;
    server_name hosimi.net www.hosimi.net;

    # レスポンスの gzip 圧縮。
    # /api/stars は全天のカタログを返すため約725KBあり、圧縮すると約156KBになる。
    #
    # Rails は Thruster 経由で起動しており Thruster 自身も圧縮できるが、
    # Thruster が待ち受けるのは :80 で、ここから proxy_pass しているのは
    # Puma の :3000 のため、その圧縮は効いていない。
    gzip on;

    # プロキシしたレスポンスも圧縮する。
    # 既定値は off で、その場合バックエンド由来のレスポンスは一切圧縮されない。
    gzip_proxied any;

    # 内容によって圧縮の有無が変わるため、キャッシュを分けてもらう
    gzip_vary on;

    # 小さなレスポンスは圧縮しても効果が薄く、CPUだけ消費する
    gzip_min_length 1024;

    gzip_comp_level 5;

    # text/html は gzip on の時点で常に対象となるため列挙しない
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    # Next.js
    location / {
        proxy_pass http://hosimi-nextjs-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Rails API
    location /api/ {
        proxy_pass http://hosimi-rails-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
