name: Deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/hosimi-backend:latest
            ${{ env.IMAGE_BASE }}/hosimi-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_ORIGIN=${{ vars.NEXT_PUBLIC_API_ORIGIN }}
            NEXT_PUBLIC_ADOBE_FONTS_KIT_ID=${{ vars.NEXT_PUBLIC_ADOBE_FONTS_KIT_ID || 'juv0bpv' }}
          tags: |
            ${{ env.IMAGE_BASE }}/hosimi-frontend:latest
            ${{ env.IMAGE_BASE }}/hosimi-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT || '22' }}
          script_stop: true
          envs: IMAGE_TAG,GHCR_USER,GHCR_PAT,GITHUB_REPOSITORY
          script: |
            set -euo pipefail
            cd "${{ vars.DEPLOY_PATH }}"

            # 最新の docker-compose.yml / nginx 設定を取得する。
            # .env は git 管理外なので reset の影響を受けない。
            # public リポジトリなので匿名 HTTPS で取得する。サーバーの clone に
            # 認証付き URL が設定されていても動くよう remote を正規化し、
            # 資格情報の対話プロンプト（非対話セッションでは失敗する）を無効化する。
            export GIT_TERMINAL_PROMPT=0
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -c credential.helper= fetch --prune origin
            git reset --hard
            git checkout -B master origin/master

            # デプロイ対象のイメージタグを .env に固定する。
            # ロールバックはこの値を過去の commit SHA に戻して up し直す。
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            echo "${GHCR_PAT}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

            docker compose pull rails nextjs
            docker compose up -d
            docker logout ghcr.io

            # nginx の設定（./nginx をバインドマウント）は up -d では再読み込みされないため、
            # 構文チェックが通ったら明示的に reload する。
            docker compose exec -T nginx nginx -t
            docker compose exec -T nginx nginx -s reload

            docker image prune -f

            # ヘルスチェック（nginx コンテナは 127.0.0.1:8000 で待ち受け）。
            # Rails は初回起動時に db:migrate / db:seed が走り応答まで時間がかかるため、
            # 最大 3 分（5 秒 × 36 回）リトライする。失敗時は直近ログを出して異常終了。
            ok=0
            for i in $(seq 1 36); do
              if curl -fsS -o /dev/null http://127.0.0.1:8000/ \
                 && curl -fsS -o /dev/null http://127.0.0.1:8000/api/constellations; then
                ok=1
                echo "healthcheck OK (${i} 回目 / 約 $((i * 5)) 秒)"
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "healthcheck 失敗: 直近のコンテナログを出力します"
              docker compose logs --tail=80 rails nextjs nginx || true
              exit 1
            fi
