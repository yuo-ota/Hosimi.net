services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  rails:
    build: ./backend
    image: ghcr.io/yuo-ota/hosimi-backend:${IMAGE_TAG:-latest}
    depends_on:
      - db
    environment:
      HOSIMI_DATABASE_USERNAME: ${DATABASE_USERNAME}
      HOSIMI_DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    restart: always

  nextjs:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
        NEXT_PUBLIC_ADOBE_FONTS_KIT_ID: ${NEXT_PUBLIC_ADOBE_FONTS_KIT_ID:-juv0bpv}
    image: ghcr.io/yuo-ota/hosimi-frontend:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
    restart: always

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx:/etc/nginx/conf.d
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - rails
      - nextjs
    restart: always

volumes:
  pgdata: